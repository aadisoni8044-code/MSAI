<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nv Translate</title>
  <meta name="description" content="Nv Translate - Fast, reliable, and accessible language translation web application.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-logo">
        <span class="logo-badge">Nv</span>
        <h1 class="app-title">Translate</h1>
      </div>
      <div class="header-actions">
        <button id="settings-btn" class="icon-btn-text" aria-label="Settings" title="API Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          <span class="btn-label">Settings</span>
        </button>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
          <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.3 2c.43 0 .77.35.72.78-.3 2.53.5 5.12 2.37 6.99 1.87 1.87 4.46 2.67 6.99 2.37.43-.05.78.29.78.72-.03 5.48-4.48 9.94-9.96 9.94-5.5 0-9.96-4.46-9.96-9.96 0-5.48 4.46-9.93 9.96-9.93z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-content">
    <div class="translator-container">
      <!-- Language Selection Bar -->
      <div class="language-bar">
        <button id="source-lang-btn" class="lang-selector-btn" aria-label="Select source language">
          <span id="source-lang-name">Auto Detect</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </button>

        <button id="swap-lang-btn" class="swap-btn" aria-label="Swap languages" title="Swap languages">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        </button>

        <button id="target-lang-btn" class="lang-selector-btn" aria-label="Select target language">
          <span id="target-lang-name">Spanish</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
      </div>

      <!-- Translation Workspace Cards -->
      <div class="translation-grid">
        <!-- Source Input Card -->
        <div class="card source-card">
          <div class="card-body">
            <textarea id="source-text" class="text-area" placeholder="Enter text to translate..." maxlength="5000" aria-label="Source Text Input"></textarea>
            <div id="detected-lang-badge" class="detected-badge hidden"></div>
          </div>
          <div class="card-footer">
            <div class="footer-left">
              <button id="mic-btn" class="icon-btn" aria-label="Voice Input" title="Voice Input">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
              </button>
              <button id="speak-source-btn" class="icon-btn" aria-label="Listen to source text" title="Listen" style="display: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              </button>
              <button id="paste-btn" class="chip-btn" title="Paste from clipboard">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 2h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 1H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
                <span>Paste</span>
              </button>
            </div>
            <div class="footer-right">
              <span id="char-count" class="char-count">0 / 5000</span>
              <button id="clear-btn" class="icon-btn" aria-label="Clear source text" title="Clear text" style="display: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
              </button>
              <button id="copy-source-btn" class="icon-btn" aria-label="Copy source text" title="Copy source text" style="display: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Target Output Card -->
        <div id="result-card" class="card target-card">
          <div class="card-body">
            <textarea id="target-text" class="text-area" placeholder="Translation will appear here..." readonly aria-label="Target Text Output"></textarea>
          </div>
          <div class="card-footer">
            <div class="footer-left">
              <span id="result-status" class="result-status">Ready</span>
            </div>
            <div class="footer-right">
              <button id="speak-target-btn" class="icon-btn" aria-label="Listen to translation" title="Listen" style="display: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              </button>
              <button id="fav-target-btn" class="icon-btn fav-btn" aria-label="Save to favorites" title="Favorite" style="display: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
              </button>
              <button id="copy-target-btn" class="icon-btn" aria-label="Copy translation" title="Copy translation" style="display: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Button Bar -->
      <div class="action-bar">
        <button id="translate-btn" class="primary-btn" disabled>
          <span>Translate</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </div>

      <!-- History & Favorites Section -->
      <section class="saved-section">
        <div class="tab-header">
          <div class="tabs">
            <button id="history-tab-btn" class="tab-btn active">History</button>
            <button id="favorites-tab-btn" class="tab-btn">Favorites</button>
          </div>
          <button id="clear-history-btn" class="text-link-btn">Clear All</button>
        </div>

        <div id="history-list" class="history-list"></div>
        <div id="favorites-list" class="history-list hidden"></div>
      </section>
    </div>
  </main>

  <!-- Language Selection Modal -->
  <div id="lang-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="lang-modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="lang-modal-title" class="modal-title">Select Language</h2>
        <button id="close-lang-modal-btn" class="icon-btn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="lang-search-input" placeholder="Search language..." aria-label="Search Language">
        </div>

        <div id="recent-langs-container" class="lang-group">
          <h3 class="group-title">Recently Used</h3>
          <div id="recent-langs-list" class="recent-langs-grid"></div>
        </div>

        <div class="lang-group">
          <h3 class="group-title">All Languages</h3>
          <div id="all-langs-list" class="all-langs-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- API Settings Modal -->
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settings-modal-title" class="modal-title">API Settings</h2>
        <button id="close-settings-btn" class="icon-btn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body settings-body">
        <div class="form-group">
          <label for="api-provider-select">Translation Provider</label>
          <select id="api-provider-select" class="form-control">
            <option value="mymemory">MyMemory Translation API (Free Public)</option>
            <option value="libretranslate">LibreTranslate API (Self-Hosted / Public)</option>
            <option value="demo">Demo Mode (Offline / Fallback)</option>
          </select>
        </div>

        <div id="mymemory-settings-group" class="form-group">
          <label for="mymemory-email-input">MyMemory Registered Email (Optional)</label>
          <input type="email" id="mymemory-email-input" class="form-control" placeholder="user@example.com">
          <span class="help-text">Providing an email increases MyMemory rate limit up to 10,000 words/day.</span>
        </div>

        <div id="libre-settings-group" class="form-group" style="display: none;">
          <label for="libre-endpoint-input">LibreTranslate Endpoint</label>
          <input type="url" id="libre-endpoint-input" class="form-control" placeholder="https://libretranslate.com">

          <label for="libre-api-key-input" style="margin-top: 12px;">API Key (If required by server)</label>
          <input type="password" id="libre-api-key-input" class="form-control" placeholder="Leave empty if none">
        </div>

        <div class="modal-footer">
          <button id="save-settings-btn" class="primary-btn">Save Configuration</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Application Scripts -->
  <script type="module" src="app.js"></script>
</body>
</html>

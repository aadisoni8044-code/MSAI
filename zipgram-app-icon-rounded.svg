<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');

      .brand-blue { fill: url(#blueGradientIconRounded); }

      .zip-letter {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 210px;
        letter-spacing: 9px;
        fill: #FFFFFF;
      }
    </style>

    <linearGradient id="blueGradientIconRounded" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047BB" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Squircle for Mobile App Icon (iOS/Android Maskable) -->
  <rect class="brand-blue" width="512" height="512" rx="115" ry="115" />

  <!-- White ZIP Typography -->
  <text class="zip-letter" x="259" y="270" text-anchor="middle" dominant-baseline="central">ZIP</text>
</svg>

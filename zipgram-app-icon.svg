<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');

      .bg-dark { fill: #0B0F19; }
      .brand-blue { fill: url(#blueGradientIcon); }

      .zip-letter {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 180px;
        letter-spacing: 8px;
        fill: #FFFFFF;
      }
    </style>

    <linearGradient id="blueGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047BB" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0066FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect class="bg-dark" width="512" height="512" rx="64" />

  <!-- App Icon Squircle Container -->
  <g filter="url(#subtleGlow)">
    <rect class="brand-blue" x="56" y="56" width="400" height="400" rx="104" ry="104" />
  </g>

  <!-- White ZIP Typography -->
  <text class="zip-letter" x="258" y="270" text-anchor="middle" dominant-baseline="central">ZIP</text>
</svg>
